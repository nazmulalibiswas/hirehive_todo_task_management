{% extends 'master/base.html'%}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header">
        <h4 class="mb-0">Login to Your Account</h4>
      </div>
      <div class="card-body">
        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label for="id_username" class="form-label">Username</label>
            <input type="text" class="form-control" name="username" id="id_username" placeholder="Enter your username" required>
          </div>

          <div class="mb-3">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" class="form-control" name="password" id="id_password" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3">Don't have an account? <a href="{% url 'register_page' %}">Register here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
